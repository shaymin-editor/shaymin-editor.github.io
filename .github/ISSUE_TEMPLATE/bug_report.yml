name: Bug report
description: Report an issue in the editor.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach ROMs or other copyrighted materials.
        To attach changes to ROMs, create an xdelta patch from **Create xdelta patch** in the ROM menu.
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Explorers of Sky
        - Explorers of Time/Explorers of Darkness
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - North America (US)
        - Europe (EU)
        - Japan (JP)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 142 on Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the ROM
        2. Go to Dungeons -> Beach Cave
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include error messages etc.
    validations:
      required: true
